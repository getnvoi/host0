# One pool per tier. replicas is the plane's; the install writes back what the pool has.
[[- range .Pools]]
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: [[.Name]]
  namespace: [[.Namespace]]
  labels: { workload: [[.Name]] }
spec:
  replicas: [[.Replicas]]
  workerImage: ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor
  template:
    annotations: { cluster-autoscaler.kubernetes.io/safe-to-evict: "false" }
    nodeSelector: { hz.dev/worker: "true" }
    tolerations:
      - { key: ate.dev/sandboxClass, operator: Equal, value: gvisor, effect: NoSchedule }
    resources:
      limits: { cpu: "[[.CPU]]", memory: [[.Memory]] }
      requests: { cpu: "[[.CPURequest]]", memory: [[.Memory]] }
[[- end]]
