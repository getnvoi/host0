# Environment and system images. Listens on the private address only; nodes pull it through their registries.yaml mirror.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: hz-system
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec:
      hostNetwork: true
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      containers:
        - name: registry
          image: registry:3
          env:
            - { name: REGISTRY_HTTP_ADDR, value: "[[.Registry]]" }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: REGISTRY_HTTP_DEBUG_ADDR, value: "127.0.0.1:5002" }
          volumeMounts: [{ name: data, mountPath: /var/lib/registry }]
      volumes:
        - name: data
          hostPath: { path: /var/lib/hz/registry, type: DirectoryOrCreate }
