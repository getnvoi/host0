# The public edge: on the control node's own 80 and 443, TLS for *.<zone>, every request to the plane.
apiVersion: v1
kind: ServiceAccount
metadata: { name: proxy, namespace: hz-system }
---
# The ACME account and certificates live in one Secret the install creates; the proxy reads and rewrites only it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: proxy, namespace: hz-system }
rules:
  - { apiGroups: [""], resources: [secrets], resourceNames: [proxy-certs], verbs: [get, update] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: proxy, namespace: hz-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: proxy }
subjects: [{ kind: ServiceAccount, name: proxy, namespace: hz-system }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: proxy, namespace: hz-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: proxy } }
  template:
    metadata: { labels: { app: proxy } }
    spec:
      serviceAccountName: proxy
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: { node-role.kubernetes.io/control-plane: "[[.ControlLabel]]" }
      containers:
        - name: proxy
          image: ko://github.com/getnvoi/host0/proxy
          # The image's user is not root; binding 80 and 443 needs root with this one capability.
          securityContext:
            runAsUser: 0
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          env:
            - { name: HZ_UPSTREAM, value: "[[.Service]]" }
            - { name: HZ_STORAGE, value: /var/lib/hz/proxy }
            - { name: HZ_ZONE, valueFrom: { secretKeyRef: { name: dns, key: zone } } }
            - { name: HZ_DNS_PROVIDER, valueFrom: { secretKeyRef: { name: dns, key: provider } } }
            - { name: HZ_DNS_CREDS, valueFrom: { secretKeyRef: { name: dns, key: creds } } }
          ports:
            - { containerPort: 80, hostPort: 80 }
            - { containerPort: 443, hostPort: 443 }
          volumeMounts:
            - { name: journal, mountPath: /var/lib/hz/proxy }
      volumes:
        # The challenge journal outlives the pod on the node it is pinned to.
        - name: journal
          hostPath: { path: /var/lib/hz/proxy, type: DirectoryOrCreate }
