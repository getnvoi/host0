# The public edge: on the control node's own 80 and 443, TLS for *.<zone>, every request to the plane.
apiVersion: apps/v1
kind: Deployment
metadata: { name: proxy, namespace: hz-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: proxy } }
  template:
    metadata: { labels: { app: proxy } }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: { node-role.kubernetes.io/control-plane: "[[.ControlLabel]]" }
      containers:
        - name: proxy
          image: ko://github.com/getnvoi/host0/dns/cmd/proxy
          env:
            - { name: HZ_UPSTREAM, value: "[[.Service]]" }
            - { name: HZ_STORAGE, value: /var/lib/hz/proxy }
            - { name: HZ_ZONE, valueFrom: { secretKeyRef: { name: dns, key: zone } } }
            - { name: HZ_DNS_PROVIDER, valueFrom: { secretKeyRef: { name: dns, key: provider } } }
            - { name: HZ_DNS_CREDS, valueFrom: { secretKeyRef: { name: dns, key: creds } } }
          ports:
            - { containerPort: 80, hostPort: 80 }
            - { containerPort: 443, hostPort: 443 }
          volumeMounts:
            - { name: certs, mountPath: /var/lib/hz/proxy }
      volumes:
        # The account, the certificate and the challenge journal outlive the pod on the node it is pinned to.
        - name: certs
          hostPath: { path: /var/lib/hz/proxy, type: DirectoryOrCreate }
