# Hetzner workers from 0 to [[.WorkerMax]]; it lives on the control node, which it never removes.
apiVersion: v1
kind: ServiceAccount
metadata: { name: cluster-autoscaler, namespace: kube-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: cluster-autoscaler }
rules:
  - { apiGroups: [""], resources: [events, endpoints], verbs: [create, patch] }
  - { apiGroups: [""], resources: [pods/eviction], verbs: [create] }
  - { apiGroups: [""], resources: [pods/status], verbs: [update] }
  - { apiGroups: [""], resources: [endpoints], resourceNames: [cluster-autoscaler], verbs: [get, update] }
  - { apiGroups: [""], resources: [nodes], verbs: [watch, list, get, update] }
  - { apiGroups: [""], resources: [namespaces, pods, services, replicationcontrollers, persistentvolumeclaims, persistentvolumes], verbs: [watch, list, get] }
  - { apiGroups: [apps, extensions], resources: [statefulsets, replicasets, daemonsets], verbs: [watch, list, get] }
  - { apiGroups: [policy], resources: [poddisruptionbudgets], verbs: [watch, list] }
  - { apiGroups: [storage.k8s.io], resources: [storageclasses, csinodes, csistoragecapacities, csidrivers, volumeattachments], verbs: [watch, list, get] }
  - { apiGroups: [batch], resources: [jobs, cronjobs], verbs: [get, list, watch, patch] }
  - { apiGroups: [coordination.k8s.io], resources: [leases], verbs: [create] }
  - { apiGroups: [coordination.k8s.io], resources: [leases], resourceNames: [cluster-autoscaler], verbs: [get, update] }
  - { apiGroups: [resource.k8s.io], resources: ["*"], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: cluster-autoscaler }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-autoscaler }
subjects: [{ kind: ServiceAccount, name: cluster-autoscaler, namespace: kube-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: cluster-autoscaler, namespace: kube-system }
rules:
  - { apiGroups: [""], resources: [configmaps], verbs: [create, list, watch] }
  - { apiGroups: [""], resources: [configmaps], resourceNames: [cluster-autoscaler-status], verbs: [delete, get, update, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: cluster-autoscaler, namespace: kube-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cluster-autoscaler }
subjects: [{ kind: ServiceAccount, name: cluster-autoscaler, namespace: kube-system }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cluster-autoscaler, namespace: kube-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: cluster-autoscaler } }
  template:
    metadata: { labels: { app: cluster-autoscaler } }
    spec:
      serviceAccountName: cluster-autoscaler
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      containers:
        - name: cluster-autoscaler
          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.36.1
          command:
            - ./cluster-autoscaler
            - --cloud-provider=hetzner
            - --nodes=0:[[.WorkerMax]]:[[.WorkerType]]:[[.Location]]:workers
            - --scale-down-unneeded-time=5m
            - --scale-down-delay-after-add=5m
            - --expander=least-waste
          env:
            - { name: HCLOUD_TOKEN, valueFrom: { secretKeyRef: { name: hcloud, key: token } } }
            - { name: HCLOUD_CLUSTER_CONFIG, valueFrom: { secretKeyRef: { name: hcloud, key: cluster-config } } }
            - { name: HCLOUD_NETWORK, value: "[[.Prefix]]" }
            - { name: HCLOUD_FIREWALL, value: "[[.Prefix]]" }
            - { name: HCLOUD_SSH_KEY, value: "[[.Prefix]]" }
          resources:
            requests: { cpu: 100m, memory: 300Mi }
