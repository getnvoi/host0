# benbonnet/dummy-rails: Rails 8, Postgres, Solid Queue, Tailwind.
name: dummy
repo: benbonnet/dummy-rails
branch: main
image: ruby:3.4.4
preview: 3000
tier: medium
env:
  RAILS_ENV: development
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  BUNDLE_PATH: /workspace/.bundle
secrets: [RAILS_MASTER_KEY]
setup:
  - bundle install
  # The build fails after 10s with no output: the wait for postgres says so each second, and --trace names each task.
  - for i in $(seq 60); do ruby -rsocket -e 'Socket.tcp(ENV["POSTGRES_HOST"], 5432, connect_timeout:1).close' 2>/dev/null && break; echo "waiting for postgres on $POSTGRES_HOST:5432 ($i/60)"; sleep 1; done
  - bin/rails db:prepare --trace
  - bin/rails tailwindcss:build
services:
  - name: postgres
    image: postgres:17
    early: true
    command: chmod 755 / /workspace && exec docker-entrypoint.sh postgres
    env: { PGDATA: /workspace/.pg }
  - name: app
    command: bin/rails server -b 0.0.0.0 -p 3000
    port: 3000
  - name: css
    command: bin/rails tailwindcss:watch[always]
  - name: jobs
    command: bin/jobs
