# benbonnet/dummy-rails: Rails 8, Postgres, Solid Queue, Tailwind.
name: dummy
repo: benbonnet/dummy-rails
branch: main
image: ruby:3.4.4
preview: 3000
tier: medium
env:
  RAILS_ENV: development
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  BUNDLE_PATH: /workspace/.bundle
secrets: [RAILS_MASTER_KEY]
setup:
  - bundle install
  - for i in $(seq 30); do bin/rails db:prepare && break; sleep 2; done
  - bin/rails tailwindcss:build
services:
  - name: postgres
    image: postgres:17
    early: true
    command: chmod 755 / /workspace && exec docker-entrypoint.sh postgres
    env: { PGDATA: /workspace/.pg }
  - name: app
    command: bin/rails server -b 0.0.0.0 -p 3000
    port: 3000
  - name: css
    command: bin/rails tailwindcss:watch[always]
  - name: jobs
    command: bin/jobs
tools:
  set_title: auto
  push_branch: auto
  create_pull_request: approval
