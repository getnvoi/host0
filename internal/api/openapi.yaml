components:
  schemas:
    Agent:
      additionalProperties: false
      properties:
        description:
          type: string
        instructions:
          type: string
        model:
          type: string
        name:
          type: string
        tools:
          items:
            $ref: "#/components/schemas/Grant"
          nullable: true
          type: array
      required:
        - name
        - tools
      type: object
    AgentInput:
      additionalProperties: false
      properties:
        description:
          type: string
        instructions:
          type: string
        model:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    Approval:
      additionalProperties: false
      properties:
        allow:
          type: boolean
        at:
          format: date-time
          type: string
        by:
          type: string
        decided:
          format: date-time
          type: string
        id:
          type: string
        input:
          type: string
        outcome:
          type: string
        session:
          type: string
        state:
          type: string
        tool:
          type: string
        tool_id:
          type: string
        turn:
          format: int64
          type: integer
      required:
        - id
        - session
        - tool
        - input
        - state
        - at
      type: object
    AtRest:
      additionalProperties: false
      properties:
        dir:
          description: The directory the database lives in
          type: string
        files:
          description: Each file in the directory
          items:
            $ref: "#/components/schemas/File"
          nullable: true
          type: array
        foreign:
          description: Files in the directory that are not the database, its -wal or its -shm
          items:
            type: string
          nullable: true
          type: array
        found:
          description: Markers found in the files, summed over files; 0 when encrypted
          format: int64
          type: integer
        markers:
          description: Plaintext values read through the database and searched for in its files
          format: int64
          type: integer
        ok:
          description: No plain header, no marker found, no foreign file and every sealed value sealed
          type: boolean
        plain:
          description: Files that start with a plain SQLite or WAL header
          items:
            type: string
          nullable: true
          type: array
        sealed:
          description: Values of sealed columns, as stored
          format: int64
          type: integer
        unsealed:
          description: Sealed columns holding a value without the sealed prefix, as table.column
          items:
            type: string
          nullable: true
          type: array
      required:
        - dir
        - ok
        - markers
        - found
        - plain
        - foreign
        - sealed
        - unsealed
        - files
      type: object
    Browser:
      additionalProperties: false
      properties:
        at:
          description: When it signed in
          format: date-time
          type: string
        label:
          type: string
        until:
          description: When its cookie expires
          format: date-time
          type: string
      required:
        - label
        - at
        - until
      type: object
    Changes:
      additionalProperties: false
      properties:
        added:
          format: int64
          type: integer
        at:
          format: date-time
          type: string
        base:
          type: string
        files:
          items:
            $ref: "#/components/schemas/FileChange"
          nullable: true
          type: array
        patch:
          type: string
        removed:
          format: int64
          type: integer
        truncated:
          type: boolean
      required:
        - base
        - at
        - added
        - removed
        - truncated
        - files
        - patch
      type: object
    Cluster:
      additionalProperties: false
      properties:
        edge:
          items:
            $ref: "#/components/schemas/Host"
          nullable: true
          type: array
        name:
          type: string
        nodes:
          items:
            $ref: "#/components/schemas/Node"
          nullable: true
          type: array
        pools:
          items:
            $ref: "#/components/schemas/Pool"
          nullable: true
          type: array
        workers:
          items:
            $ref: "#/components/schemas/Worker"
          nullable: true
          type: array
        zone:
          type: string
      required:
        - name
        - zone
        - nodes
        - pools
        - workers
        - edge
      type: object
    CredentialsInput:
      additionalProperties: false
      properties:
        github:
          type: string
      type: object
    CredentialsSet:
      additionalProperties: false
      properties:
        stored:
          items:
            type: string
          nullable: true
          type: array
      required:
        - stored
      type: object
    Environment:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
      type: object
    EnvironmentInput:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
      type: object
    EnvironmentPatch:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
      type: object
    EnvironmentSummary:
      additionalProperties: false
      properties:
        branch:
          type: string
        name:
          type: string
        ready:
          type: boolean
        repo:
          type: string
        tier:
          type: string
      required:
        - name
        - repo
        - branch
        - tier
        - ready
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        content:
          type: string
        kind:
          type: string
        meta: {}
        parent:
          type: string
        tool:
          type: string
        tool_id:
          type: string
      required:
        - kind
        - at
      type: object
      x-go-type: llm.Event
      x-go-type-import:
        path: github.com/getnvoi/host0/internal/llm
    Field:
      additionalProperties: false
      properties:
        default:
          type: string
        help:
          type: string
        key:
          type: string
        label:
          type: string
        options:
          items:
            $ref: "#/components/schemas/Option"
          nullable: true
          type: array
        placeholder:
          type: string
        required:
          type: boolean
        secret:
          type: boolean
        type:
          type: string
      required:
        - key
        - label
        - type
      type: object
      x-go-type: llm.Field
      x-go-type-import:
        path: github.com/getnvoi/host0/internal/llm
    File:
      additionalProperties: false
      properties:
        foreign:
          description: It is not the database, its -wal or its -shm
          type: boolean
        found:
          description: Markers found in it
          format: int64
          type: integer
        name:
          type: string
        plain:
          description: It starts with a plain SQLite or WAL header
          type: boolean
        size:
          description: Bytes
          format: int64
          type: integer
      required:
        - name
        - size
        - plain
        - found
        - foreign
      type: object
    FileChange:
      additionalProperties: false
      properties:
        added:
          format: int64
          type: integer
        binary:
          type: boolean
        old_path:
          type: string
        path:
          type: string
        removed:
          format: int64
          type: integer
        status:
          type: string
      required:
        - path
        - status
        - added
        - removed
        - binary
      type: object
    Grant:
      additionalProperties: false
      properties:
        level:
          type: string
        tool:
          type: string
      required:
        - tool
        - level
      type: object
    Hit:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        env:
          type: string
        in:
          type: string
        kind:
          type: string
        position:
          format: int64
          type: integer
        removed:
          type: boolean
        session:
          type: string
        snippet:
          type: string
      required:
        - session
        - env
        - in
        - position
        - snippet
        - at
      type: object
    Host:
      additionalProperties: false
      properties:
        error:
          type: string
        name:
          type: string
      required:
        - name
      type: object
    LLMConfig:
      additionalProperties: false
      properties:
        archived_at:
          format: date-time
          type: string
        at:
          format: date-time
          type: string
        main:
          type: boolean
        name:
          type: string
        provider:
          type: string
        stored:
          items:
            type: string
          nullable: true
          type: array
        values:
          additionalProperties:
            type: string
          type: object
      required:
        - name
        - provider
        - values
        - main
        - at
      type: object
    LLMConfigInput:
      additionalProperties: false
      properties:
        main:
          type: boolean
        name:
          type: string
        provider:
          type: string
        values:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
      required:
        - name
        - provider
        - values
      type: object
    LLMConfigValues:
      additionalProperties: false
      properties:
        values:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
      required:
        - values
      type: object
    Level:
      additionalProperties: false
      properties:
        level:
          enum:
            - auto
            - approval
          type: string
      required:
        - level
      type: object
    Log:
      additionalProperties: false
      properties:
        kind:
          type: string
        name:
          type: string
      required:
        - name
        - kind
      type: object
    LoginLink:
      additionalProperties: false
      properties:
        url:
          description: Signs one browser in, once, within 60 seconds
          type: string
      required:
        - url
      type: object
    LoginLinkInput:
      additionalProperties: false
      properties:
        label:
          description: Who the browser signs in as
