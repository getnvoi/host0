        approval_wait_ms:
          format: int64
          type: integer
        approvals:
          format: int64
          type: integer
        compute_minutes:
          format: double
          type: number
        pull_requests:
          format: int64
          type: integer
        sessions:
          format: int64
          type: integer
        tokens:
          format: int64
          type: integer
      required:
        - sessions
        - compute_minutes
        - pull_requests
        - tokens
        - approvals
        - approval_wait_ms
      type: object
    Withdrawal:
      additionalProperties: false
      properties:
        text:
          type: string
      required:
        - text
      type: object
    Worker:
      additionalProperties: false
      properties:
        actors:
          items:
            type: string
          nullable: true
          type: array
        assigned:
          type: boolean
        pod:
          type: string
        pool:
          type: string
      required:
        - pool
        - pod
        - assigned
      type: object
  securitySchemes:
    bearer:
      description: The token h0 cluster install mints, on the api host.
      scheme: bearer
      type: http
    cookie:
      description: "A browser signed in with a link, under /api on the app host; a write carries X-Requested-With: h0."
      in: cookie
      name: h0_session
      type: apiKey
info:
  title: h0 plane
  version: "1"
openapi: 3.0.3
paths:
  /agents:
    get:
      operationId: agent.ls
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Agent"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The agents sessions run as
      x-h0:
        columns:
          - name
          - model
          - description
        output: table
  /agents/{name}:
    delete:
      operationId: agent.rm
      parameters:
        - description: The agent's name
          in: path
          name: name
          required: true
          schema:
            description: The agent's name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove the agent; sessions that ran as it keep its name
      x-h0:
        columns:
          - tool
          - level
        field: tools
        noTool: true
        output: table
    get:
      operationId: agent.show
      parameters:
        - description: The agent's name
          in: path
          name: name
          required: true
          schema:
            description: The agent's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The agent and the tools it is granted
      x-h0:
        columns:
          - tool
          - level
        field: tools
        output: table
    put:
      operationId: agent.put
      parameters:
        - description: The agent's name
          in: path
          name: name
          required: true
          schema:
            description: The agent's name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Declare the agent: its description, model, instructions and tools, which replace those it has"
      x-h0:
        columns:
          - tool
          - level
        field: tools
        noTool: true
        output: table
  /agents/{name}/tools/{tool}:
    delete:
      operationId: agent.tool.rm
      parameters:
        - description: The agent's name
          in: path
          name: name
          required: true
          schema:
            description: The agent's name
            type: string
        - description: "The tool's name: an operation id, dots as underscores (session_push)"
          in: path
          name: tool
          required: true
          schema:
            description: "The tool's name: an operation id, dots as underscores (session_push)"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Take a tool from the agent
      x-h0:
        columns:
          - tool
          - level
        field: tools
        noTool: true
        output: table
    put:
      operationId: agent.tool.set
      parameters:
        - description: The agent's name
          in: path
          name: name
          required: true
          schema:
            description: The agent's name
            type: string
        - description: "The tool's name: an operation id, dots as underscores (session_push)"
          in: path
          name: tool
          required: true
          schema:
            description: "The tool's name: an operation id, dots as underscores (session_push)"
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Level"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Grant the agent a tool, or change the level it has it at
      x-h0:
        columns:
          - tool
          - level
        field: tools
        noTool: true
        output: table
  /approvals:
    get:
      operationId: approval.ls
      parameters:
        - description: Only this session's
          explode: false
          in: query
          name: session
          schema:
            description: Only this session's
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Approval"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Actions waiting for a decision
      x-h0:
        by:
          - session follow
          - approval approve
          - approval deny
        columns:
          - id
          - session
          - tool
          - input
        output: table
  /approvals/{id}:
    get:
      operationId: approval.show
      parameters:
        - description: The approval's id
          in: path
          name: id
          required: true
          schema:
            description: The approval's id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One approval in full, decided or not
      x-h0:
        by:
          - approval show
  /approvals/{id}/approve:
    post:
      operationId: approval.approve
      parameters:
        - description: The approval's id
          in: path
          name: id
          required: true
          schema:
            description: The approval's id
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Carry the action out; the outcome turn follows, and the stream tells how it went
      x-h0:
        by:
          - approval approve
        noTool: true
  /approvals/{id}/deny:
    post:
      operationId: approval.deny
      parameters:
        - description: The approval's id
          in: path
          name: id
          required: true
          schema:
            description: The approval's id
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Refuse the action; the outcome turn follows, and the stream tells how it went
      x-h0:
        by:
          - approval deny
        noTool: true
  /browsers:
    delete:
      operationId: logout.all
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedOut"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Sign out every browser
      x-h0:
        by:
          - logout
    get:
      operationId: browsers
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Browser"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Browsers signed in to the web UI
      x-h0:
        columns:
          - label
          - at
          - until
        output: table
  /browsers/{label}:
    delete:
      operationId: logout
      parameters:
        - description: The label their link was asked with
          in: path
          name: label
          required: true
          schema:
            description: The label their link was asked with
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedOut"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Sign out the browsers under label
      x-h0:
        by:
          - logout
  /cluster:
    get:
      operationId: ls
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "The cluster now: its nodes, worker pools, workers and the plane's hosts"
      x-h0:
        by:
          - ls
  /cluster/db:
    get:
      operationId: cluster.db
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtRest"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "The plane's database as it lies on disk: no plaintext, no foreign file, every secret sealed"
      x-h0:
        columns:
          - ok
          - dir
          - markers
          - found
          - plain
          - foreign
          - sealed
          - unsealed
          - files
        noTool: true
        output: fields
  /cluster/pods:
    get:
      operationId: pods
      parameters:
        - description: Only this node's pods
          explode: false
          in: query
          name: node
          schema:
            description: Only this node's pods
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Pod"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every pod in the cluster, or one node's
      x-h0:
        columns:
          - namespace
          - name
          - node
          - phase
        output: table
  /cluster/pods/{namespace}/{pod}/log:
    get:
      operationId: logs
      parameters:
        - description: The pod's namespace, as h0 pods prints it
          in: path
          name: namespace
          required: true
          schema:
            description: The pod's namespace, as h0 pods prints it
            type: string
        - description: The pod's name
          in: path
          name: pod
          required: true
          schema:
            description: The pod's name
            type: string
        - description: The container, when the pod has several
          explode: false
          in: query
          name: container
          schema:
            description: The container, when the pod has several
            type: string
        - description: Lines from the end
          explode: false
          in: query
          name: tail
          schema:
            default: 200
            description: Lines from the end
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodLog"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The end of a cluster pod's log
      x-h0:
        field: log
        output: raw
  /cluster/shape:
    get:
      operationId: cluster.shape
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shape"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The workers and tiers h0 cluster install declared
      x-h0:
        output: fields
    put:
      operationId: cluster.shape.put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Shape"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Declare the workers and tiers
      x-h0:
        by:
          - cluster install
  /credentials:
    get:
      operationId: credentials.get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsSet"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Which credentials hold a value, never the values
      x-h0:
        by:
          - credentials ls
    put:
      operationId: credentials.put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Replace the workspace's credentials; one given empty is removed
      x-h0:
        by:
          - credentials
  /credentials/{name}:
    delete:
      operationId: credentials.rm
      parameters:
        - description: github
          in: path
          name: name
          required: true
          schema:
            description: github
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Remove a credential: github (agent credentials: h0 llm rm)"
      x-h0:
        output: none
  /environments:
    get:
      operationId: env.ls
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EnvironmentSummary"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every environment, and whether a session can fork from it now
      x-h0:
        columns:
          - name
          - repo
          - branch
          - tier
          - ready
        output: table
  /environments/{name}:
    delete:
      operationId: env.rm
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove the environment and its seed; refused while a session uses it
      x-h0:
        output: none
    get:
      operationId: env.get
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The environment, its secrets' values left out
      x-h0:
        by:
          - env get
          - env var rm
          - env secret rm
          - env setup ls
          - env setup add
          - env setup rm
          - env service ls
          - env service add
          - env service set
          - env service rm
    patch:
      operationId: env.set
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/EnvironmentPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change the environment's fields; h0 env seed rebuilds its seed
      x-h0:
        by:
          - env var set
          - env var rm
          - env secret set
          - env secret rm
          - env setup add
          - env setup rm
          - env service add
          - env service set
          - env service rm
        output: none
    put:
      operationId: env.put
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare the environment whole; a secret given empty keeps its value
      x-h0:
        by:
          - env apply
          - env create
  /environments/{name}/seed:
    get:
      operationId: env.status
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seed"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "The environment's seed build: the one under way, or the last to end"
      x-h0:
        by:
          - env seed
        columns:
          - env
          - state
          - step
          - error
          - actor
          - tag
          - preview
          - at
        output: fields
    post:
      operationId: env.seed
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Build the environment's seed: clone, set up, start its services, snapshot and tag it"
      x-h0:
        by:
          - env seed
  /github/repositories:
    get:
      operationId: github.repositories
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Repository"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The repositories the GitHub App's installations reach with the workspace's GitHub token
      x-h0:
        columns:
          - full_name
          - default_branch
          - private
        output: table
  /llm/configs:
    get:
      operationId: llm.ls
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LLMConfig"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "The agent credentials: live first, then archived; secrets left out"
      x-h0:
        by:
          - credentials
          - credentials ls
        columns:
          - name
          - provider
          - main
          - archived_at
          - stored
          - values
        output: table
    post:
      operationId: llm.add
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMConfigInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfig"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add an agent credential; the first live one is in use
      x-h0:
        by:
          - credentials
  /llm/configs/{name}:
    delete:
      operationId: llm.rm
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
        - description: Delete it rather than archive it
          explode: false
          in: query
          name: remove
          schema:
            description: Delete it rather than archive it
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Archive the credential; --remove deletes it
      x-h0:
        output: none
    put:
      operationId: llm.set
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMConfigValues"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfig"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change a credential's values; a secret left empty keeps the stored one
      x-h0:
        by:
          - credentials
  /llm/configs/{name}/main:
    post:
      operationId: llm.use
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run turns on this credential
      x-h0:
        by:
          - credentials
        output: none
  /llm/configs/{name}/restore:
    post:
      operationId: llm.restore
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
