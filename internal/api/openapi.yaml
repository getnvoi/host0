components:
  schemas:
    Browser:
      additionalProperties: false
      properties:
        at:
          description: When it signed in
          format: date-time
          type: string
        label:
          type: string
        until:
          description: When its cookie expires
          format: date-time
          type: string
      required:
        - label
        - at
        - until
      type: object
    Cluster:
      additionalProperties: false
      properties:
        edge:
          items:
            $ref: "#/components/schemas/Host"
          nullable: true
          type: array
        name:
          type: string
        nodes:
          items:
            $ref: "#/components/schemas/Node"
          nullable: true
          type: array
        pools:
          items:
            $ref: "#/components/schemas/Pool"
          nullable: true
          type: array
        workers:
          items:
            $ref: "#/components/schemas/Worker"
          nullable: true
          type: array
        zone:
          type: string
      required:
        - name
        - zone
        - nodes
        - pools
        - workers
        - edge
      type: object
    CredentialsInput:
      additionalProperties: false
      properties:
        github:
          type: string
      type: object
    CredentialsSet:
      additionalProperties: false
      properties:
        stored:
          items:
            type: string
          nullable: true
          type: array
      required:
        - stored
      type: object
    Environment:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentInput:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentPatch:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentSummary:
      additionalProperties: false
      properties:
        branch:
          type: string
        name:
          type: string
        ready:
          type: boolean
        repo:
          type: string
        tier:
          type: string
      required:
        - name
        - repo
        - branch
        - tier
        - ready
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Field:
      additionalProperties: false
      properties:
        default:
          type: string
        help:
          type: string
        key:
          type: string
        label:
          type: string
        options:
          items:
            $ref: "#/components/schemas/Option"
          nullable: true
          type: array
        placeholder:
          type: string
        required:
          type: boolean
        secret:
          type: boolean
        type:
          type: string
      required:
        - key
        - label
        - type
      type: object
    Host:
      additionalProperties: false
      properties:
        error:
          type: string
        name:
          type: string
      required:
        - name
      type: object
    LLMConfig:
      additionalProperties: false
      properties:
        archived_at:
          format: date-time
          type: string
        at:
          format: date-time
          type: string
        main:
          type: boolean
        name:
          type: string
        provider:
          type: string
        stored:
          items:
            type: string
          nullable: true
          type: array
        values:
          additionalProperties:
            type: string
          type: object
      required:
        - name
        - provider
        - values
        - main
        - at
      type: object
    LLMConfigInput:
      additionalProperties: false
      properties:
        main:
          type: boolean
        name:
          type: string
        provider:
          type: string
        values:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
      required:
        - name
        - provider
        - values
      type: object
    LLMConfigValues:
      additionalProperties: false
      properties:
        values:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
      required:
        - values
      type: object
    LoginLink:
      additionalProperties: false
      properties:
        url:
          description: Signs one browser in, once, within 60 seconds
          type: string
      required:
        - url
      type: object
    LoginLinkInput:
      additionalProperties: false
      properties:
        label:
          description: Who the browser signs in as
          minLength: 1
          type: string
      required:
        - label
      type: object
    Me:
      additionalProperties: false
      properties:
        cluster:
          type: string
        zone:
          type: string
      required:
        - cluster
        - zone
      type: object
    Node:
      additionalProperties: false
      properties:
        addresses:
          items:
            type: string
          nullable: true
          type: array
        created:
          format: date-time
          type: string
        name:
          type: string
        providerID:
          type: string
        ready:
          type: boolean
        roles:
          items:
            type: string
          nullable: true
          type: array
      required:
        - name
        - roles
        - ready
        - addresses
        - providerID
        - created
      type: object
    Option:
      additionalProperties: false
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - value
        - label
      type: object
    Pod:
      additionalProperties: false
      properties:
        name:
          type: string
        namespace:
          type: string
        node:
          type: string
        phase:
          type: string
      required:
        - namespace
        - name
        - node
        - phase
      type: object
    PodLog:
      additionalProperties: false
      properties:
        log:
          description: The last lines of the container's log
          type: string
      required:
        - log
      type: object
    Pool:
      additionalProperties: false
      properties:
        name:
          type: string
        ready:
          format: int64
          type: integer
        replicas:
          format: int64
          type: integer
      required:
        - name
        - replicas
        - ready
      type: object
    PreviewInput:
      additionalProperties: false
      properties:
        host:
          description: The preview's host, as a session or a seed names it
          minLength: 1
          type: string
      required:
        - host
      type: object
    PreviewLink:
      additionalProperties: false
      properties:
        url:
          description: Opens the preview past its gate for 12 hours
          type: string
      required:
        - url
      type: object
    Provider:
      additionalProperties: false
      properties:
        fields:
          items:
            $ref: "#/components/schemas/Field"
          nullable: true
          type: array
        key:
          type: string
        label:
          type: string
      required:
        - key
        - label
        - fields
      type: object
    Seed:
      additionalProperties: false
      properties:
        actor:
          type: string
        at:
          format: date-time
          type: string
        env:
          type: string
        error:
          type: string
        line:
          type: string
        lines:
          format: int64
          type: integer
        preview:
          type: string
        run:
          type: string
        spec:
          type: string
        state:
          type: string
        step:
          type: string
        tag:
          type: string
        template:
          type: string
      required:
        - env
        - actor
        - template
        - tag
        - state
        - at
      type: object
    Servers:
      additionalProperties: false
      properties:
        idle:
          format: int64
          type: integer
        location:
          type: string
        max:
          format: int64
          type: integer
        type:
          type: string
      required:
        - type
        - location
        - max
        - idle
      type: object
    Service:
      additionalProperties: false
      properties:
        command:
          type: string
        early:
          type: boolean
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        port:
          format: int64
          type: integer
      required:
        - name
        - command
      type: object
    Shape:
      additionalProperties: false
      properties:
        tiers:
          items:
            $ref: "#/components/schemas/Tier"
          nullable: true
          type: array
        workers:
          $ref: "#/components/schemas/Servers"
      required:
        - workers
        - tiers
      type: object
    SignedOut:
      additionalProperties: false
      properties:
        count:
          description: How many browsers were signed out
          format: int64
          type: integer
      required:
        - count
      type: object
    Suspended:
      additionalProperties: false
      properties:
        actor:
          description: The actor suspended
          type: string
      required:
        - actor
      type: object
    Tier:
      additionalProperties: false
      properties:
        cpu:
          type: string
        cpuRequest:
          type: string
        default:
          type: boolean
        memory:
          type: string
        name:
          type: string
      required:
        - name
        - cpu
        - memory
        - cpuRequest
      type: object
    Usage:
      additionalProperties: false
      properties:
        days:
          items:
            $ref: "#/components/schemas/UsageDay"
          nullable: true
          type: array
        environments:
          items:
            $ref: "#/components/schemas/UsageEnv"
          nullable: true
          type: array
        from:
          type: string
        people:
          items:
            type: string
          nullable: true
          type: array
        to:
          type: string
        totals:
          $ref: "#/components/schemas/UsageTotal"
      required:
        - from
        - to
        - people
        - totals
        - days
        - environments
      type: object
    UsageDay:
      additionalProperties: false
      properties:
        compute:
          additionalProperties:
            format: double
            type: number
          type: object
        day:
          type: string
        nodes:
          format: double
          type: number
        pull_requests:
          format: int64
          type: integer
        sessions:
          format: int64
          type: integer
        states:
          additionalProperties:
            format: double
            type: number
          type: object
        tokens:
          format: int64
          type: integer
      required:
        - day
        - compute
        - states
        - sessions
        - pull_requests
        - tokens
        - nodes
      type: object
    UsageEnv:
      additionalProperties: false
      properties:
        compute_minutes:
          format: double
          type: number
        name:
          type: string
        pull_requests:
          format: int64
          type: integer
        sessions:
          format: int64
          type: integer
        tokens:
          format: int64
          type: integer
      required:
        - name
        - compute_minutes
        - sessions
        - pull_requests
        - tokens
      type: object
    UsageTotal:
      additionalProperties: false
      properties:
        approval_wait_ms:
          format: int64
          type: integer
        approvals:
          format: int64
          type: integer
        compute_minutes:
          format: double
          type: number
        pull_requests:
          format: int64
          type: integer
        sessions:
          format: int64
          type: integer
        tokens:
          format: int64
          type: integer
      required:
        - sessions
        - compute_minutes
        - pull_requests
        - tokens
        - approvals
        - approval_wait_ms
      type: object
    Worker:
      additionalProperties: false
      properties:
        actors:
          items:
            type: string
          nullable: true
          type: array
        assigned:
          type: boolean
        pod:
          type: string
        pool:
          type: string
      required:
        - pool
        - pod
        - assigned
      type: object
  securitySchemes:
    bearer:
      description: The token hz cluster install mints, on the api host.
      scheme: bearer
      type: http
    cookie:
      description: "A browser signed in with a link, under /api on the app host; a write carries X-Requested-With: hz."
      in: cookie
      name: hz_session
      type: apiKey
info:
  title: hz plane
  version: "1"
openapi: 3.0.3
paths:
  /browsers:
    delete:
      operationId: logout.all
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedOut"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Sign out every browser
      x-hz:
        by:
          - logout
    get:
      operationId: browsers
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Browser"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Browsers signed in to the web UI
      x-hz:
        columns:
          - label
          - at
          - until
        output: table
  /browsers/{label}:
    delete:
      operationId: logout
      parameters:
        - description: The label their link was asked with
          in: path
          name: label
          required: true
          schema:
            description: The label their link was asked with
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedOut"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Sign out the browsers under label
      x-hz:
        by:
          - logout
  /cluster:
    get:
      operationId: ls
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "The cluster now: its nodes, worker pools, workers and the plane's hosts"
      x-hz:
        by:
          - ls
  /cluster/pods:
    get:
      operationId: pods
      parameters:
        - description: Only this node's pods
          explode: false
          in: query
          name: node
          schema:
            description: Only this node's pods
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Pod"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every pod in the cluster, or one node's
      x-hz:
        columns:
          - namespace
          - name
          - node
          - phase
        output: table
  /cluster/pods/{namespace}/{pod}/log:
    get:
      operationId: logs
      parameters:
        - description: The pod's namespace, as hz pods prints it
          in: path
          name: namespace
          required: true
          schema:
            description: The pod's namespace, as hz pods prints it
            type: string
        - description: The pod's name
          in: path
          name: pod
          required: true
          schema:
            description: The pod's name
            type: string
        - description: The container, when the pod has several
          explode: false
          in: query
          name: container
          schema:
            description: The container, when the pod has several
            type: string
        - description: Lines from the end
          explode: false
          in: query
          name: tail
          schema:
            default: 200
            description: Lines from the end
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodLog"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The end of a cluster pod's log
      x-hz:
        field: log
        output: raw
  /cluster/shape:
    get:
      operationId: cluster.shape
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shape"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The workers and tiers hz cluster install declared
      x-hz:
        output: fields
    put:
      operationId: cluster.shape.put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Shape"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Declare the workers and tiers
      x-hz:
        by:
          - cluster install
  /credentials:
    get:
      operationId: credentials.get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsSet"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Which credentials hold a value, never the values
      x-hz:
        by:
          - credentials ls
    put:
      operationId: credentials.put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Replace the workspace's credentials; one given empty is removed
      x-hz:
        by:
          - credentials
  /credentials/{name}:
    delete:
      operationId: credentials.rm
      parameters:
        - description: github
          in: path
          name: name
          required: true
          schema:
            description: github
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Remove a credential: github (agent credentials: hz llm rm)"
      x-hz:
        output: none
  /environments:
    get:
      operationId: env.ls
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EnvironmentSummary"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every environment, and whether a session can fork from it now
      x-hz:
        columns:
          - name
          - repo
          - branch
          - tier
          - ready
        output: table
  /environments/{name}:
    delete:
      operationId: env.rm
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove the environment and its seed; refused while a session uses it
      x-hz:
        output: none
    get:
      operationId: env.get
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The environment, its secrets' values left out
      x-hz:
        by:
          - env get
          - env var rm
          - env secret rm
          - env setup ls
          - env setup add
          - env setup rm
          - env service ls
          - env service add
          - env service set
          - env service rm
          - env tool rm
    patch:
      operationId: env.set
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/EnvironmentPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change the environment's fields; hz env seed rebuilds its seed
      x-hz:
        by:
          - env var set
          - env var rm
          - env secret set
          - env secret rm
          - env setup add
          - env setup rm
          - env service add
          - env service set
          - env service rm
          - env tool set
          - env tool rm
        output: none
    put:
      operationId: env.put
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare the environment whole; a secret given empty keeps its value
