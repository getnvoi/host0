components:
  schemas:
    Environment:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentInput:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentPatch:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentSummary:
      additionalProperties: false
      properties:
        branch:
          type: string
        name:
          type: string
        ready:
          type: boolean
        repo:
          type: string
        tier:
          type: string
      required:
        - name
        - repo
        - branch
        - tier
        - ready
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Me:
      additionalProperties: false
      properties:
        cluster:
          type: string
        zone:
          type: string
      required:
        - cluster
        - zone
      type: object
    Service:
      additionalProperties: false
      properties:
        command:
          type: string
        early:
          type: boolean
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        port:
          format: int64
          type: integer
      required:
        - name
        - command
      type: object
  securitySchemes:
    bearer:
      description: The token hz cluster install mints, on the api host.
      scheme: bearer
      type: http
    cookie:
      description: "A browser signed in with a link, under /api on the app host; a write carries X-Requested-With: hz."
      in: cookie
      name: hz_session
      type: apiKey
info:
  title: hz plane
  version: "1"
openapi: 3.0.3
paths:
  /environments:
    get:
      operationId: env.ls
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EnvironmentSummary"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every environment, and whether a session can fork from it now
      x-hz:
        columns:
          - name
          - repo
          - branch
          - tier
          - ready
        output: table
  /environments/{name}:
    delete:
      operationId: env.rm
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove the environment and its seed; refused while a session uses it
      x-hz:
        output: none
    get:
      operationId: env.get
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The environment, its secrets' values left out
      x-hz:
        by:
          - env get
          - env var rm
          - env secret rm
          - env setup ls
          - env setup add
          - env setup rm
          - env service ls
          - env service add
          - env service set
          - env service rm
          - env tool rm
    patch:
      operationId: env.set
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/EnvironmentPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change the environment's fields; hz env seed rebuilds its seed
      x-hz:
        by:
          - env var set
          - env var rm
          - env secret set
          - env secret rm
          - env setup add
          - env setup rm
          - env service add
          - env service set
          - env service rm
          - env tool set
          - env tool rm
        output: none
    put:
      operationId: env.put
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare the environment whole; a secret given empty keeps its value
      x-hz:
        by:
          - env apply
          - env create
  /me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The cluster and zone this plane serves
      x-hz:
        output: fields
security:
  - bearer: []
  - cookie: []
