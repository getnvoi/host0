components:
  schemas:
    Approval:
      additionalProperties: false
      properties:
        allow:
          type: boolean
        at:
          format: date-time
          type: string
        by:
          type: string
        decided:
          format: date-time
          type: string
        id:
          type: string
        input:
          type: string
        outcome:
          type: string
        session:
          type: string
        state:
          type: string
        tool:
          type: string
        turn:
          format: int64
          type: integer
      required:
        - id
        - session
        - tool
        - input
        - state
        - at
      type: object
    Changes:
      additionalProperties: false
      properties:
        added:
          format: int64
          type: integer
        at:
          format: date-time
          type: string
        base:
          type: string
        files:
          items:
            $ref: "#/components/schemas/FileChange"
          nullable: true
          type: array
        patch:
          type: string
        removed:
          format: int64
          type: integer
        truncated:
          type: boolean
      required:
        - base
        - at
        - added
        - removed
        - truncated
        - files
        - patch
      type: object
    CredentialsInput:
      additionalProperties: false
      properties:
        github:
          type: string
      type: object
    CredentialsSet:
      additionalProperties: false
      properties:
        stored:
          items:
            type: string
          nullable: true
          type: array
      required:
        - stored
      type: object
    Environment:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentInput:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentPatch:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentSummary:
      additionalProperties: false
      properties:
        branch:
          type: string
        name:
          type: string
        ready:
          type: boolean
        repo:
          type: string
        tier:
          type: string
      required:
        - name
        - repo
        - branch
        - tier
        - ready
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        content:
          type: string
        kind:
          type: string
        meta: {}
        parent:
          type: string
        tool:
          type: string
        tool_id:
          type: string
      required:
        - kind
        - at
      type: object
    Field:
      additionalProperties: false
      properties:
        default:
          type: string
        help:
          type: string
        key:
          type: string
        label:
          type: string
        options:
          items:
            $ref: "#/components/schemas/Option"
          nullable: true
          type: array
        placeholder:
          type: string
        required:
          type: boolean
        secret:
          type: boolean
        type:
          type: string
      required:
        - key
        - label
        - type
      type: object
    FileChange:
      additionalProperties: false
      properties:
        added:
          format: int64
          type: integer
        binary:
          type: boolean
        old_path:
          type: string
        path:
          type: string
        removed:
          format: int64
          type: integer
        status:
          type: string
      required:
        - path
        - status
        - added
        - removed
        - binary
      type: object
    LLMConfig:
      additionalProperties: false
      properties:
        archived_at:
          format: date-time
          type: string
        at:
          format: date-time
          type: string
        main:
          type: boolean
        name:
          type: string
        provider:
          type: string
        stored:
          items:
            type: string
          nullable: true
          type: array
        values:
          additionalProperties:
            type: string
          type: object
      required:
        - name
        - provider
        - values
        - main
        - at
      type: object
    LLMConfigInput:
      additionalProperties: false
      properties:
        main:
          type: boolean
        name:
          type: string
        provider:
          type: string
        values:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
      required:
        - name
        - provider
        - values
      type: object
    LLMConfigValues:
      additionalProperties: false
      properties:
        values:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
      required:
        - values
      type: object
    Log:
      additionalProperties: false
      properties:
        kind:
          type: string
        name:
          type: string
      required:
        - name
        - kind
      type: object
    Me:
      additionalProperties: false
      properties:
        cluster:
          type: string
        zone:
          type: string
      required:
        - cluster
        - zone
      type: object
    Message:
      additionalProperties: false
      properties:
        prompt:
          type: string
        to:
          description: The sub-agent's tool call it is for; the main agent passes it on
          type: string
      required:
        - prompt
      type: object
    Option:
      additionalProperties: false
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - value
        - label
      type: object
    PreviewStatus:
      additionalProperties: false
      properties:
        error:
          type: string
        status:
          format: int64
          type: integer
        up:
          type: boolean
      required:
        - up
      type: object
    Provider:
      additionalProperties: false
      properties:
        fields:
          items:
            $ref: "#/components/schemas/Field"
          nullable: true
          type: array
        key:
          type: string
        label:
          type: string
      required:
        - key
        - label
        - fields
      type: object
    Seed:
      additionalProperties: false
      properties:
        actor:
          type: string
        at:
          format: date-time
          type: string
        env:
          type: string
        error:
          type: string
        line:
          type: string
        lines:
          format: int64
          type: integer
        preview:
          type: string
        run:
          type: string
        spec:
          type: string
        state:
          type: string
        step:
          type: string
        tag:
          type: string
        template:
          type: string
      required:
        - env
        - actor
        - template
        - tag
        - state
        - at
      type: object
    Service:
      additionalProperties: false
      properties:
        command:
          type: string
        early:
          type: boolean
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        port:
          format: int64
          type: integer
      required:
        - name
        - command
      type: object
    Session:
      additionalProperties: false
      properties:
        actor:
          type: string
        at:
          format: date-time
          type: string
        branch:
          type: string
        by:
          type: string
        env:
          type: string
        error:
          type: string
        events:
          items:
            $ref: "#/components/schemas/Event"
          nullable: true
          type: array
        forked:
          type: boolean
        id:
          type: string
        last:
          format: date-time
          type: string
        mark:
          format: int64
          type: integer
        outcomes:
          items:
            type: string
          nullable: true
          type: array
        pending:
          type: string
        preview:
          type: string
        state:
          type: string
        title:
          type: string
        transcript:
          type: string
        turns:
          format: int64
          type: integer
      required:
        - id
        - env
        - actor
        - branch
        - preview
        - transcript
        - turns
        - state
        - events
        - mark
        - at
        - last
      type: object
    SessionInput:
      additionalProperties: false
      properties:
        env:
          description: The environment whose seed it forks
          type: string
        prompt:
          description: Its first message
          type: string
      required:
        - env
      type: object
    Summary:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        branch:
          type: string
        by:
          type: string
        env:
          type: string
        error:
          type: string
        id:
          type: string
        last:
          format: date-time
          type: string
        preview:
          type: string
        prompt:
          type: string
        queued:
          format: int64
          type: integer
        state:
          type: string
        title:
          type: string
      required:
        - id
        - env
        - branch
        - preview
        - state
        - prompt
        - queued
        - at
        - last
      type: object
    Suspended:
      additionalProperties: false
      properties:
        actor:
          description: The actor suspended
          type: string
      required:
        - actor
      type: object
    Terminal:
      additionalProperties: false
      properties:
        clients:
          format: int64
          type: integer
        command:
          type: string
        id:
          type: string
        started:
          type: string
      required:
        - id
        - command
        - started
        - clients
      type: object
    Update:
      additionalProperties: false
      properties:
        approval:
          $ref: "#/components/schemas/Approval"
        events:
          items:
            $ref: "#/components/schemas/Event"
          nullable: true
          type: array
        from:
          format: int64
          type: integer
        kind:
          type: string
        seed:
          $ref: "#/components/schemas/Seed"
        session:
          $ref: "#/components/schemas/Summary"
      required:
        - kind
        - from
      type: object
    Withdrawal:
      additionalProperties: false
      properties:
        text:
          type: string
      required:
        - text
      type: object
  securitySchemes:
    bearer:
      description: The token hz cluster install mints, on the api host.
      scheme: bearer
      type: http
    cookie:
      description: "A browser signed in with a link, under /api on the app host; a write carries X-Requested-With: hz."
      in: cookie
      name: hz_session
      type: apiKey
info:
  title: hz plane
  version: "1"
openapi: 3.0.3
paths:
  /credentials:
    get:
      operationId: credentials.get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsSet"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Which credentials hold a value, never the values
      x-hz:
        by:
          - credentials ls
    put:
      operationId: credentials.put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Replace the workspace's credentials; one given empty is removed
      x-hz:
        by:
          - credentials
  /credentials/{name}:
    delete:
      operationId: credentials.rm
      parameters:
        - description: github
          in: path
          name: name
          required: true
          schema:
            description: github
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Remove a credential: github (agent credentials: hz llm rm)"
      x-hz:
        output: none
  /environments:
    get:
      operationId: env.ls
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EnvironmentSummary"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every environment, and whether a session can fork from it now
      x-hz:
        columns:
          - name
          - repo
          - branch
          - tier
          - ready
        output: table
  /environments/{name}:
    delete:
      operationId: env.rm
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove the environment and its seed; refused while a session uses it
      x-hz:
        output: none
    get:
      operationId: env.get
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The environment, its secrets' values left out
      x-hz:
        by:
          - env get
          - env var rm
          - env secret rm
          - env setup ls
          - env setup add
          - env setup rm
          - env service ls
          - env service add
          - env service set
          - env service rm
          - env tool rm
    patch:
      operationId: env.set
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/EnvironmentPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change the environment's fields; hz env seed rebuilds its seed
      x-hz:
        by:
          - env var set
          - env var rm
          - env secret set
          - env secret rm
          - env setup add
          - env setup rm
          - env service add
          - env service set
          - env service rm
          - env tool set
          - env tool rm
        output: none
    put:
      operationId: env.put
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare the environment whole; a secret given empty keeps its value
      x-hz:
        by:
          - env apply
          - env create
  /environments/{name}/seed:
    get:
      operationId: env.status
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seed"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "The environment's seed build: the one under way, or the last to end"
      x-hz:
        by:
          - env seed
        columns:
          - env
          - state
          - step
          - error
          - actor
          - tag
          - preview
          - at
        output: fields
    post:
      operationId: env.seed
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Build the environment's seed: clone, set up, start its services, snapshot and tag it"
      x-hz:
        by:
          - env seed
  /llm/configs:
    get:
      operationId: llm.ls
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LLMConfig"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "The agent credentials: live first, then archived; secrets left out"
      x-hz:
        by:
          - credentials
          - credentials ls
        columns:
          - name
          - provider
          - main
          - archived_at
          - stored
          - values
        output: table
    post:
      operationId: llm.add
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMConfigInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfig"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add an agent credential; the first live one is in use
      x-hz:
        by:
          - credentials
  /llm/configs/{name}:
    delete:
      operationId: llm.rm
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
        - description: Delete it rather than archive it
          explode: false
          in: query
          name: remove
          schema:
            description: Delete it rather than archive it
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Archive the credential; --remove deletes it
      x-hz:
        output: none
    put:
      operationId: llm.set
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMConfigValues"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfig"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change a credential's values; a secret left empty keeps the stored one
      x-hz:
        by:
          - credentials
  /llm/configs/{name}/main:
    post:
      operationId: llm.use
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run turns on this credential
      x-hz:
        by:
          - credentials
        output: none
  /llm/configs/{name}/restore:
    post:
      operationId: llm.restore
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Bring an archived credential back
      x-hz:
        output: none
  /llm/providers:
    get:
      operationId: llm.providers
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Provider"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The agent CLIs a credential can be for, and their fields
      x-hz:
        by:
          - credentials
        columns:
          - key
          - label
        output: table
  /me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The cluster and zone this plane serves
      x-hz:
        output: fields
  /seeds/{name}/suspend:
    post:
      operationId: env.suspend
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
