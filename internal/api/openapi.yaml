          type: string
      required:
        - prompt
      type: object
    Node:
      additionalProperties: false
      properties:
        addresses:
          items:
            type: string
          nullable: true
          type: array
        created:
          format: date-time
          type: string
        name:
          type: string
        providerID:
          type: string
        ready:
          type: boolean
        roles:
          items:
            type: string
          nullable: true
          type: array
      required:
        - name
        - roles
        - ready
        - addresses
        - providerID
        - created
      type: object
    Option:
      additionalProperties: false
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - value
        - label
      type: object
      x-go-type: llm.Option
      x-go-type-import:
        path: github.com/getnvoi/host0/internal/llm
    Page:
      additionalProperties: false
      properties:
        path:
          description: Its path, from / (/health)
