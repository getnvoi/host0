components:
  schemas:
    CredentialsInput:
      additionalProperties: false
      properties:
        github:
          type: string
      type: object
    CredentialsSet:
      additionalProperties: false
      properties:
        stored:
          items:
            type: string
          nullable: true
          type: array
      required:
        - stored
      type: object
    Environment:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentInput:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentPatch:
      additionalProperties: false
      properties:
        branch:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        preview:
          format: int64
          type: integer
        repo:
          type: string
        secrets:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        setup:
          items:
            type: string
          nullable: true
          type: array
        tier:
          type: string
        tools:
          additionalProperties:
            type: string
          type: object
      type: object
    EnvironmentSummary:
      additionalProperties: false
      properties:
        branch:
          type: string
        name:
          type: string
        ready:
          type: boolean
        repo:
          type: string
        tier:
          type: string
      required:
        - name
        - repo
        - branch
        - tier
        - ready
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Field:
      additionalProperties: false
      properties:
        default:
          type: string
        help:
          type: string
        key:
          type: string
        label:
          type: string
        options:
          items:
            $ref: "#/components/schemas/Option"
          nullable: true
          type: array
        placeholder:
          type: string
        required:
          type: boolean
        secret:
          type: boolean
        type:
          type: string
      required:
        - key
        - label
        - type
      type: object
    LLMConfig:
      additionalProperties: false
      properties:
        archived_at:
          format: date-time
          type: string
        at:
          format: date-time
          type: string
        main:
          type: boolean
        name:
          type: string
        provider:
          type: string
        stored:
          items:
            type: string
          nullable: true
          type: array
        values:
          additionalProperties:
            type: string
          type: object
      required:
        - name
        - provider
        - values
        - main
        - at
      type: object
    LLMConfigInput:
      additionalProperties: false
      properties:
        main:
          type: boolean
        name:
          type: string
        provider:
          type: string
        values:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
      required:
        - name
        - provider
        - values
      type: object
    LLMConfigValues:
      additionalProperties: false
      properties:
        values:
          additionalProperties:
            type: string
          type: object
          writeOnly: true
      required:
        - values
      type: object
    Me:
      additionalProperties: false
      properties:
        cluster:
          type: string
        zone:
          type: string
      required:
        - cluster
        - zone
      type: object
    Option:
      additionalProperties: false
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - value
        - label
      type: object
    Provider:
      additionalProperties: false
      properties:
        fields:
          items:
            $ref: "#/components/schemas/Field"
          nullable: true
          type: array
        key:
          type: string
        label:
          type: string
      required:
        - key
        - label
        - fields
      type: object
    Service:
      additionalProperties: false
      properties:
        command:
          type: string
        early:
          type: boolean
        env:
          additionalProperties:
            type: string
          type: object
        image:
          type: string
        name:
          type: string
        port:
          format: int64
          type: integer
      required:
        - name
        - command
      type: object
  securitySchemes:
    bearer:
      description: The token hz cluster install mints, on the api host.
      scheme: bearer
      type: http
    cookie:
      description: "A browser signed in with a link, under /api on the app host; a write carries X-Requested-With: hz."
      in: cookie
      name: hz_session
      type: apiKey
info:
  title: hz plane
  version: "1"
openapi: 3.0.3
paths:
  /credentials:
    get:
      operationId: credentials.get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsSet"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Which credentials hold a value, never the values
      x-hz:
        by:
          - credentials ls
    put:
      operationId: credentials.put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Replace the workspace's credentials; one given empty is removed
      x-hz:
        by:
          - credentials
  /credentials/{name}:
    delete:
      operationId: credentials.rm
      parameters:
        - description: github
          in: path
          name: name
          required: true
          schema:
            description: github
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Remove a credential: github (agent credentials: hz llm rm)"
      x-hz:
        output: none
  /environments:
    get:
      operationId: env.ls
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EnvironmentSummary"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every environment, and whether a session can fork from it now
      x-hz:
        columns:
          - name
          - repo
          - branch
          - tier
          - ready
        output: table
  /environments/{name}:
    delete:
      operationId: env.rm
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove the environment and its seed; refused while a session uses it
      x-hz:
        output: none
    get:
      operationId: env.get
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The environment, its secrets' values left out
      x-hz:
        by:
          - env get
          - env var rm
          - env secret rm
          - env setup ls
          - env setup add
          - env setup rm
          - env service ls
          - env service add
          - env service set
          - env service rm
          - env tool rm
    patch:
      operationId: env.set
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/EnvironmentPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change the environment's fields; hz env seed rebuilds its seed
      x-hz:
        by:
          - env var set
          - env var rm
          - env secret set
          - env secret rm
          - env setup add
          - env setup rm
          - env service add
          - env service set
          - env service rm
          - env tool set
          - env tool rm
        output: none
    put:
      operationId: env.put
      parameters:
        - description: The environment's name
          in: path
          name: name
          required: true
          schema:
            description: The environment's name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare the environment whole; a secret given empty keeps its value
      x-hz:
        by:
          - env apply
          - env create
  /llm/configs:
    get:
      operationId: llm.ls
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LLMConfig"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "The agent credentials: live first, then archived; secrets left out"
      x-hz:
        by:
          - credentials
          - credentials ls
        columns:
          - name
          - provider
          - main
          - archived_at
          - stored
          - values
        output: table
    post:
      operationId: llm.add
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMConfigInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfig"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add an agent credential; the first live one is in use
      x-hz:
        by:
          - credentials
  /llm/configs/{name}:
    delete:
      operationId: llm.rm
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
        - description: Delete it rather than archive it
          explode: false
          in: query
          name: remove
          schema:
            description: Delete it rather than archive it
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Archive the credential; --remove deletes it
      x-hz:
        output: none
    put:
      operationId: llm.set
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMConfigValues"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfig"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change a credential's values; a secret left empty keeps the stored one
      x-hz:
        by:
          - credentials
  /llm/configs/{name}/main:
    post:
      operationId: llm.use
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run turns on this credential
      x-hz:
        by:
          - credentials
        output: none
  /llm/configs/{name}/restore:
    post:
      operationId: llm.restore
      parameters:
        - description: The credential's label
          in: path
          name: name
          required: true
          schema:
            description: The credential's label
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Bring an archived credential back
      x-hz:
        output: none
  /llm/providers:
    get:
      operationId: llm.providers
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Provider"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The agent CLIs a credential can be for, and their fields
      x-hz:
        by:
          - credentials
        columns:
          - key
          - label
        output: table
  /me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The cluster and zone this plane serves
      x-hz:
        output: fields
security:
  - bearer: []
  - cookie: []
